<body>
<div id="app">
<h1>Marginalia</h1>
<p>Marginalia is a free reading notes app. Save quotes, topics and stories by book and chapter, review them with spaced repetition, and grow a garden as you finish books.</p>
<noscript><p>Marginalia needs JavaScript to run.</p></noscript>
</div>
<dialog id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<nav id="nav" aria-label="Main"><div class="navin">
<button data-act="tab" data-t="shelf"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><path d="M16.5 6l3.5 1-3 13-3.5-1z"/></svg>Shelf</button>
<button data-act="tab" data-t="review"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.300M20 12a8 8 0 0 1-14 5.300"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Review<span id="rb" class="badge"></span></button>
<button class="qa" data-act="quick" aria-label="Quick add note"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
<button data-act="tab" data-t="garden"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13C7.500 13 5.500 10 5.500 6.500 10 6.500 12 9.500 12 13z"/><path d="M12 11c0-3 2-5 6.500-5 0 4-2 6.500-6.500 6.500"/></svg>Garden</button>
<button data-act="tab" data-t="journey"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>Journey</button>
</div></nav>
<script>
var KEY="marginalia-v1",S={books:[]},view=null,filter="all",q="",anim=true,tab="shelf",rshown=false;
var DAYS=[1,3,7,30];
var MOTTOS=["A page a day is a whole library in a year.","Read slowly. Remember longer.","The line you underline today is the idea you use tomorrow.","Every book you finish leaves you a different reader.","Write it down, and it stays yours.","Small notes, kept daily, become a mind you can search.","Read as if you will have to teach it."];
function motto(){return MOTTOS[Math.floor(Date.now()/864e5)%MOTTOS.length]}
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var COLORS=["#1F4E5F","#6B3F5E","#7A5C2E","#3E5C48","#8A3B3B","#3B4A7A"];
var TYPES={quote:"Quote",topic:"Topic",story:"Story"},PLURAL={quote:"Quotes",topic:"Topics",story:"Stories"};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function book(id){return S.books.filter(function(b){return b.id===id})[0]}
function fmt(ts){return new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function count(n){return n+(n===1?" note":" notes")}
function find(id){for(var i=0;i<S.books.length;i++)for(var j=0;j<S.books[i].notes.length;j++)if(S.books[i].notes[j].id===id)return[S.books[i].notes[j],S.books[i]]}
function due(n){return n.due||n.ts+864e5}
function dueList(){var a=[],now=Date.now();S.books.forEach(function(b){b.notes.forEach(function(n){if(due(n)<=now)a.push([n,b])})});return a.sort(function(x,y){return due(x[0])-due(y[0])})}
function nextDue(){var m=0;S.books.forEach(function(b){b.notes.forEach(function(n){var d=due(n);if(!m||d<m)m=d})});return m}
function rateNote(n,r){var s=n.rs||0;if(r==="forgot")s=0;else if(r==="good")s=Math.min(s+1,3);n.rs=s;n.due=Date.now()+DAYS[s]*864e5;n.rc=(n.rc||0)+1;S.days=S.days||[];if(S.days.indexOf(day())<0)S.days.push(day())}

var n=L[0][0],b=L[0][1],s=n.rs||0,w=n.text.split(/\s+/);
h+='<p class="meta">'+L.length+' to review</p><section class="note rcard '+n.type+'"><div class="tag">'+TYPES[n.type]+' from “'+esc(b.title)+'”'+(n.chapter?', '+esc(n.chapter):'')+'</div>';

else h+='<div class="txt">'+esc(n.text)+'</div><p class="meta" style="margin:16px 0 8px">How well did you remember it?</p><div class="rate">'+[["forgot","Forgot","1 day"],["hard","Hard",DAYS[s]+(DAYS[s]===1?" day":" days")],["good","Got it",DAYS[Math.min(s+1,3)]+" days"]].map(function(r){return '<button data-act="rate" data-r="'+r[0]+'"><b>'+r[1]+'</b><span>Again in '+r[2]+'</span></button>'}).join("")+'</div>';

function journey(){var M={},T={quote:0,topic:0,story:0},tot=0,fin=0,lk=0;
function mo(ts){var d=new Date(ts),k=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);return M[k]=M[k]||{n:0,bk:[],fin:[],t:{quote:0,topic:0,story:0}}}
S.books.forEach(function(b){if(b.done){fin++;mo(b.doneTs||Date.now()).fin.push(b)}b.notes.forEach(function(n){var o=mo(n.ts);o.n++;o.t[n.type]++;if(o.bk.indexOf(b)<0)o.bk.push(b);T[n.type]++;tot++;lk+=(n.links||[]).length})});
var h='<div class="top"><button class="brand" data-act="about">Marginalia</button></div><div class="hero-wrap"><h1 class="hero">Your journey</h1></div><p class="motto">What you keep shows who you are becoming.</p>';
if(!tot&&!fin)return h+'<div class="empty"><b>Your story starts with one note</b>Come back after a few weeks to see how your reading has changed.</div>';
var ks=Object.keys(M).sort().reverse(),mx=Math.max.apply(null,ks.map(function(k){return M[k].n}))||1,top=["quote","topic","story"].sort(function(a,b){return T[b]-T[a]})[0];
h+='<div class="sum"><div><b>'+tot+'</b><span>notes</span></div><div><b>'+S.books.length+'</b><span>books</span></div><div><b>'+fin+'</b><span>finished</span></div><div><b>'+Math.floor(lk/2)+'</b><span>links</span></div></div>';
if(tot>=5)h+='<p class="meta" style="margin:14px 0">Most of what you save is '+PLURAL[top].toLowerCase()+' ('+Math.round(T[top]/tot*100)+'%).</p>';
ks.forEach(function(k){var o=M[k],l=new Date(k+"-01T00:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});
h+='<section class="mo"><h3>'+l+'</h3><div class="mbar"><span style="width:'+Math.round(o.n/mx*100)+'%"></span></div><p class="meta">'+count(o.n)+': '+o.t.quote+' quotes, '+o.t.topic+' topics, '+o.t.story+' stories</p>'+(o.bk.length?'<p class="meta">Reading: '+o.bk.map(function(b){return esc(b.title)}).join(", ")+'</p>':'')+o.fin.map(function(b){return '<p class="meta">Finished <b>'+esc(b.title)+'</b>'+(b.big?': “'+esc(b.big.idea)+'”':'')+'</p>'}).join("")+'</section>'});
return h}
var STAGES=["Seed planted","Sprouting","Sapling","Young tree","Fully grown"];
function stage(b){return b.done?4:b.notes.length>=8?3:b.notes.length>=3?2:b.notes.length>=1?1:0}
function tree(st,c){var T="#7A5C2E",g='<ellipse cx="50" cy="113" rx="36" ry="4" fill="currentColor" opacity=".12"/>',h=[0,16,32,48,64][st];
if(st===0)g+='<path d="M30 113Q50 98 70 113Z" fill="'+T+'" opacity=".55"/><ellipse cx="50" cy="107" rx="5" ry="3.5" fill="'+T+'"/>';
else{g+='<rect x="'+(48-st*.5)+'" y="'+(113-h)+'" width="'+(4+st)+'" height="'+h+'" rx="2" fill="'+T+'"/>';
var C=[[],[[43,100,6],[57,97,6]],[[50,113-h-4,15]],[[50,113-h-6,19],[35,113-h+6,13],[65,113-h+6,13]],[[50,113-h-10,23],[30,113-h+4,16],[70,113-h+4,16],[40,113-h-22,14],[62,113-h-20,14]]][st];
C.forEach(function(k){g+='<circle cx="'+k[0]+'" cy="'+k[1]+'" r="'+k[2]+'" fill="'+c+'" opacity=".88"/>'});
if(st>=2)C.forEach(function(k){g+='<circle cx="'+(k[0]-k[2]*.3)+'" cy="'+(k[1]-k[2]*.3)+'" r="'+k[2]*.4+'" fill="#fff" opacity=".1"/>'})}
return '<svg viewBox="0 0 100 120" role="img" aria-label="'+STAGES[st]+'">'+g+'</svg>'}
function garden(){var bs=S.books,done=bs.filter(function(b){return b.done}).length,h='<div class="top"><button class="brand" data-act="about">Marginalia</button><button class="link" data-act="addbook">Add book</button></div><div class="hero-wrap"><h1 class="hero">Your garden</h1></div><p class="motto">Every book you start is a seed. Every one you finish is a tree.</p>';
if(!bs.length)return h+'<div class="empty"><b>Nothing planted yet</b>Add a book and its seed goes into the ground.</div><button class="btn primary" data-act="addbook">Plant your first book</button>';
h+='<p class="sub">'+done+(done===1?" tree":" trees")+' fully grown, '+(bs.length-done)+' still growing.</p><div class="grove">';
bs.forEach(function(b){var st=stage(b);h+='<button class="tree" data-act="open" data-b="'+b.id+'">'+tree(st,b.color)+'<span class="tt">'+esc(b.title)+'</span><span class="meta">'+STAGES[st]+'</span></button>'});
return h+'</div>'}
function day(t){var d=new Date(t||Date.now());return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function total(){var c=0;S.books.forEach(function(b){c+=b.notes.length});return c}
function today(){var t=day(),c=0;S.books.forEach(function(b){b.notes.forEach(function(n){if(day(n.ts)===t)c++})});return c}
function streak(){var days=S.days||[],n=0,d=new Date();if(days.indexOf(day())<0)d.setDate(d.getDate()-1);while(days.indexOf(day(d))>-1){n++;d.setDate(d.getDate()-1)}return n}
function level(n){return n>=100?"Archivist":n>=50?"Scholar":n>=25?"Collector":n>=10?"Note-taker":"Reader"}
function stats(){var s=streak(),t=today(),tot=total(),dots="";for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);dots+='<i class="'+((S.days||[]).indexOf(day(d))>-1?"on":"")+'"></i>'}
var next=[10,25,50,100].filter(function(x){return x>tot})[0];
return '<section class="stats"><div class="streak"><b>'+s+'</b><span>'+(s===1?"day":"days")+' in a row</span></div><div class="dots" aria-label="Last 7 days">'+dots+'</div><div class="goal"><div class="bar"><span style="width:'+Math.min(100,t/3*100)+'%"></span></div><span>'+(t>=3?"Daily goal done":t+" of 3 notes today")+'</span></div><p class="ident">You are a <em>'+level(tot)+'</em>. '+(next?(next-tot)+" more notes to level up.":"Top level reached.")+(tot?' Your collection holds '+S.books.length+(S.books.length===1?" book":" books")+' and '+count(tot)+'.':'')+'</p></section>'}
function cuehtml(){return '<button class="cue" data-act="cue">'+(S.cue?'After I <b>'+esc(S.cue)+'</b>, I read one page and save one note.':'Set your reading cue: after what will you read each day?')+'</button>'}
function teaser(){var all=[];S.books.forEach(function(b){b.notes.forEach(function(n){all.push([n,b])})});if(all.length<3)return"";var p=all[Math.floor(Date.now()/864e5)%all.length],w=p[0].text.split(/\s+/);return '<button class="gap mask-box" data-act="reveal" data-b="'+p[1].id+'" data-n="'+p[0].id+'"><span class="meta">From “'+esc(p[1].title)+'” • Move cursor to reveal</span><span class="peek">'+esc(w.slice(0,4).join(" "))+' <span class="fog">'+esc(w.slice(4,10).join(" ")||"…")+'</span></span><span class="meta">Tap to open full note</span><div class="mask-layer"><span class="meta" style="color:var(--line)">From “'+esc(p[1].title)+'” ✨</span><span class="peek" style="color:var(--bg)">“'+esc(p[0].text.slice(0,140))+(p[0].text.length>140?'…':'')+'”</span></div></button>'}
function prog(b){var c=[];b.notes.forEach(function(n){if(n.chapter&&c.indexOf(n.chapter)<0)c.push(n.chapter)});if(!c.length)return"";return '<div class="prog"><div class="ticks">'+c.slice(0,24).map(function(){return"<i></i>"}).join("")+'</div><span>'+c.length+(c.length===1?" chapter":" chapters")+' captured</span></div>'}
function aboutSheet(){openSheet('<div class="about"><h2>About Marginalia</h2><p>Marginalia is a reading companion. It helps you save the quotes, topics and stories you want to remember, organised by book and chapter, then brings them back so they stay with you.</p><p>I built it because reading is easy to forget. Spaced review, links between books, and a garden that grows as you finish books turn reading into something that lasts.</p><div class="mask-box" style="padding:20px;border:1px dashed var(--line);background:var(--bg);text-align:center"><p class="meta" style="margin-bottom:4px">SVG Mask Effect</p><p style="font-weight:600;margin:0">Move your cursor or touch here to reveal ✨</p><div class="mask-layer"><p style="font-family:var(--serif);font-size:1.15rem;font-style:italic;margin:0;color:var(--bg)">“Read slowly. Remember longer.”</p></div></div><p class="meta">Built by Sibghatullah, a student who wanted to remember what he reads. Your notes stay on your own device.</p><div class="acts"><button type="button" class="btn primary" data-act="close">Close</button></div></div>')}

var SURPRISE=["Good catch. Notes like this are the ones you come back to.","Future you will thank you for this one.","One more idea you won’t lose.","Sharp eye. Few readers stop to write it down."];

  if(a==="open"){tab="shelf";view=t.dataset.b;filter="all";anim=true;render();window.scrollTo(0,0)}
  else if(a==="home"){tab="shelf";view=null;anim=true;render()}
  else if(a==="filter"){filter=t.dataset.t;anim=true;render()}
  else if(a==="addbook")bookForm();
  else if(a==="cue")cueForm();
  else if(a==="about")aboutSheet();
  else if(a==="quick"){var qb=view||S.last;if(!qb||!book(qb))qb=S.books[0]&&S.books[0].id;if(qb)noteForm(qb);else bookForm()}
  else if(a==="rshow"){rshown=true;render()}
  else if(a==="rate"){var cur=dueList();if(cur[0])rateNote(cur[0][0],t.dataset.r);rshown=false;save();render();if(cur.length===1)toast("Review complete. Those ideas are stronger now.")}
  else if(a==="unlink"){var uf=$("#nf"),un=find(uf.dataset.n),uo=find(t.dataset.id);un[0].links=(un[0].links||[]).filter(function(x){return x!==t.dataset.id});if(uo)uo[0].links=(uo[0].links||[]).filter(function(x){return x!==un[0].id});save();noteForm(uf.dataset.b,uf.dataset.n);render()}
  else if(a==="bigedit")bigForm(view);
  else if(a==="tab"){tab=t.dataset.t;rshown=false;view=null;anim=true;render();window.scrollTo(0,0)}
  else if(a==="finish"){var fb=book(view);fb.done=!fb.done;fb.doneTs=fb.done?Date.now():0;save();anim=fb.done;render();if(fb.done){toast("Finished. Your tree is fully grown.");if(!fb.big)setTimeout(function(){bigForm(fb.id)},900)}}
  else if(a==="reveal"){var rb=book(t.dataset.b),rn=rb.notes.filter(function(x){return x.id===t.dataset.n})[0];t.outerHTML=noteHTML(rn,rb,true)}
  else if(a==="editbook")bookForm(view);
  else if(a==="addnote")noteForm(view);
  else if(a==="edit")noteForm(t.dataset.b,t.dataset.n);
  else if(a==="close")closeSheet();
  else if(a==="delbook"){var b=book(view);if(confirm("Delete \u201C"+b.title+"\u201D and its "+count(b.notes.length)+"?")){S.books=S.books.filter(function(x){return x.id!==view});view=null;save();closeSheet();render()}}
  else if(a==="delnote"){var f=$("#nf"),bb=book(f.dataset.b);if(confirm("Delete this note?")){bb.notes=bb.notes.filter(function(x){return x.id!==f.dataset.n});save();closeSheet();render()}}
});

function handleMaskPointer(e){
  var box=e.target.closest&&e.target.closest(".mask-box");
  if(!box)return;
  var r=box.getBoundingClientRect(),x=(e.clientX||(e.touches&&e.touches[0].clientX)||0)-r.left,y=(e.clientY||(e.touches&&e.touches[0].clientY)||0)-r.top;
  box.style.setProperty("--mx",x+"px");
  box.style.setProperty("--my",y+"px");
  box.classList.add("touching");
}
document.addEventListener("pointermove",handleMaskPointer);
document.addEventListener("touchmove",handleMaskPointer,{passive:true});
document.addEventListener("pointerleave",function(e){var b=e.target.closest&&e.target.closest(".mask-box");if(b)b.classList.remove("touching")},true);

document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&e.target.form)e.target.form.requestSubmit()});
document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target,d=new FormData(f),isNew=false;if(f.id==="cf"){S.cue=d.get("cue").trim();save();closeSheet();render();return}
if(f.id==="bg"){var gb=book(f.dataset.b);gb.big={idea:d.get("idea").trim(),apply:d.get("apply").trim(),ts:Date.now()};save();closeSheet();render();toast("Big idea saved.");return}
  if(f.id==="bf"){
    var title=d.get("title").trim();if(!title)return;
    if(f.dataset.id){var b=book(f.dataset.id);b.title=title;b.author=d.get("author").trim();b.color=d.get("color")||b.color}
    else{var nb={id:uid(),title:title,author:d.get("author").trim(),color:d.get("color")||COLORS[S.books.length%COLORS.length],notes:[]};S.books.unshift(nb);tab="shelf";view=nb.id;filter="all";anim=true;setTimeout(function(){toast("Seed planted. Save a note to make it sprout.")},350)}
  }else{
    var bk=book(d.get("bk")||f.dataset.b),text=d.get("text").trim();if(!text)return;
    var data={type:d.get("type"),chapter:d.get("chapter").trim(),page:d.get("page").trim(),text:text};
    if(f.dataset.n){var n=bk.notes.filter(function(x){return x.id===f.dataset.n})[0];for(var k in data)n[k]=data[k];var lk=d.get("link");if(lk){var lo=find(lk);if(lo){n.links=n.links||[];lo[0].links=lo[0].links||[];if(n.links.indexOf(lk)<0){n.links.push(lk);lo[0].links.push(n.id)}}}}
    else{bk.notes.unshift({id:uid(),ts:Date.now(),type:data.type,chapter:data.chapter,page:data.page,text:data.text,rs:0,due:Date.now()+864e5,links:[]});isNew=true;S.last=bk.id;S.lt=data.type;S.days=S.days||[];if(S.days.indexOf(day())<0)S.days.push(day())}
    bk.lastChapter=data.chapter;if(isNew)setTimeout(reward,350);
  }
  save();closeSheet();render();
});
render();
</script>
</body>
</html>
